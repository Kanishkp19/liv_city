name: Bug Report
description: Report an unexpected behavior, invariant violation, or test regression
title: "[Bug]: <Short summary>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide details and reproduction steps to diagnose the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what happened.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Simulation Context (if applicable)
      placeholder: "World ID: world_000001, Seed: 11, Tick: 42, Agent: agent_000003"
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Run `python -m agentville.cli run --world <id> --ticks 50`\n2. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened according to specs in docs/?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Traceback / Event Logs
      render: shell
