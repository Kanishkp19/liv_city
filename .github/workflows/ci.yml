name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run mypy
      - name: Unit + property
        run: uv run pytest tests/unit tests/property
      - name: Golden
        run: uv run pytest tests/golden
      - name: Integration (docker)
        run: uv run pytest tests/integration
      - name: Adversarial
        run: uv run pytest tests/adversarial

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: control-room
      - run: npm run build
        working-directory: control-room

  nightly-calibration:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python scripts/calibrate_economy.py
